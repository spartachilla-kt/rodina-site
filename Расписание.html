<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Расписание - ХК Родина Омск</title>
<link rel="icon" href="images/Logo.png" type="image/png">
<style>
  /* === БАЗОВЫЕ СТИЛИ И ХЕДЕР === */
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; line-height: 1.6; }
  header { background: linear-gradient(135deg, #1a1a1a, #333); padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; position: relative; }
  .header-container { display: flex; align-items: center; gap: 15px; }
  header h1 { margin: 0; font-size: 1.8em; color: #fff; }
  .header-logo { width: 80px; height: 80px; object-fit: contain; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
  
  /* Кнопка меню (гамбургер) */
  .menu-btn { background: none; border: none; color: white; font-size: 2.2em; cursor: pointer; padding: 0; transition: color 0.3s; }
  .menu-btn:hover { color: #d32f2f; }
  .dropdown-menu { display: none; position: absolute; right: 20px; top: 100%; background-color: #222; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); z-index: 1000; border-radius: 0 0 8px 8px; border-top: 3px solid #d32f2f; overflow: hidden; }
  .dropdown-menu a { color: white; padding: 12px 20px; text-decoration: none; display: block; font-weight: 600; transition: background 0.3s, padding-left 0.3s; }
  .dropdown-menu a:hover { background-color: #d32f2f; padding-left: 25px; }
  .dropdown-menu.show { display: block; }

  /* === КОНТЕЙНЕР И ЗАГОЛОВКИ === */
  .container { max-width: 1100px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
  h2 { margin-top: 0; color: #222; border-bottom: 2px solid #ddd; padding-bottom: 10px; text-align: center; }
  h2::after { content: ""; display: block; width: 50px; height: 3px; background: linear-gradient(135deg, #d32f2f, #ff6f61); margin: 10px auto 0; border-radius: 2px; }

  /* === СТИЛИ ДЛЯ МАТЧЕЙ === */
  .match-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
  .match-card { display: flex; align-items: center; background: #fafafa; border: 1px solid #eee; border-radius: 12px; padding: 15px 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); transition: transform 0.2s; }
  .match-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }

  /* Логотипы в круглых рамках */
  .logo-circle { width: 60px; height: 60px; border-radius: 50%; background-color: #ddd; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
  .logo-circle span { font-size: 0.7em; color: #666; text-align: center; padding: 5px; }

  /* Информация о командах и счете */
  .match-info { display: flex; align-items: center; gap: 15px; flex: 1; }
  .team-name { font-weight: bold; font-size: 1.1em; }
  .score-board { font-size: 1.5em; font-weight: bold; color: #222; background: #fff; padding: 5px 15px; border-radius: 8px; border: 1px solid #ddd; }
  .score-board .ot-badge { font-size: 0.5em; vertical-align: super; color: #d32f2f; margin-left: 5px; }
  
  /* Дата и номер матча */
  .match-meta { display: flex; flex-direction: column; align-items: flex-end; font-size: 0.9em; color: #555; margin-left: 20px; }
  .match-number { font-weight: bold; color: #d32f2f; }
  .match-date { white-space: nowrap; }

  /* Подпись арены */
  .arena-label { font-size: 0.8em; color: #888; margin-top: 5px; text-align: center; width: 100%; }

  /* Адаптивность */
  @media (max-width: 768px) {
    .match-card { flex-direction: column; align-items: flex-start; gap: 10px; }
    .match-meta { align-items: flex-start; margin-left: 0; }
    .match-info { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<header>
  <div class="header-container">
    <img src="images/Logo.png" alt="Логотип" class="header-logo" />
    <h1>ХК «Родина» Омск</h1>
  </div>
  <button class="menu-btn" onclick="toggleMenu(event)">&#9776;</button>
  <div class="dropdown-menu" id="dropdownMenu">
    <a href="index.html">Главная</a>
    <a href="Состав.html">Команда</a>
    <a href="Расписание.html">Расписание</a>
    <a href="#">Билеты</a>
    <a href="Новости.html">Новости</a>
    <a href="Персонал.html">Персонал</a>
  </div>
</header>

<div class="container">
  <h2>Расписание матчей</h2>
  <div id="schedule-container" class="match-list">
    <p style="text-align: center; color: #777;">Загрузка расписания с сервера лиги...</p>
  </div>
</div>

<div class="container" style="margin-top:40px; text-align:center;">
  <h2>Следите за нами в соцсетях</h2>
  <p><a href="https://t.me/RodinaOmsk" target="_blank" style="color:#d32f2f; font-weight:600;">Телеграм</a></p>
</div>

<footer style="background: #222; color: #eee; text-align: center; padding: 20px; margin-top: 40px;">
  &copy; 2026 ХК «Родина» Омск. Все права защищены.
</footer>

<script>
  // === ЛОГИКА МЕНЮ ===
  function toggleMenu(event) {
    event.stopPropagation();
    document.getElementById('dropdownMenu').classList.toggle('show');
  }
  window.onclick = function(event) {
    var dropdown = document.getElementById('dropdownMenu');
    if (!event.target.matches('.menu-btn') && dropdown.classList.contains('show')) {
      dropdown.classList.remove('show');
    }
  }

  // === ПОЛУЧЕНИЕ ДАННЫХ ЧЕРЕЗ ПРОКСИ ===
  async function fetchSchedule() {
    const container = document.getElementById("schedule-container");
    // Мы используем прокси allorigins, чтобы обойти блокировку CORS
    // Внимание: URL ниже взят с потолка для примера. Нам нужно найти реальный API эндпоинт!
    const targetUrl = "https://challenge.place/api/v1/stages/68ea54bb7acb128162131d02/matches"; 
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

    try {
      const response = await fetch(proxyUrl);
      const proxyData = await response.json();
      
      // Прокси возвращает данные в виде строки в поле contents
      const data = JSON.parse(proxyData.contents);
      
      console.log("Данные от сервера:", data); // Для отладки (F12 -> Консоль)
      
      if (data && data.matches) {
         renderMatches(data.matches);
      } else {
         // Если структура другая, выведем ошибку
         container.innerHTML = `<p style="text-align: center; color: #d32f2f;">Данные получены, но структура не распознана. Проверьте консоль.</p>`;
      }
      
    } catch (error) {
      console.error("Ошибка:", error);
      container.innerHTML = `<p style="text-align: center; color: #d32f2f;">Не удалось загрузить расписание. Сервер лиги отклонил запрос.</p>`;
    }
  }

  // Функция отрисовки (оставил как была, она верная)
  function renderMatches(matches) {
    const container = document.getElementById("schedule-container");
    container.innerHTML = ""; 

    // Простая сортировка
    matches.sort((a, b) => new Date(a.date) - new Date(b.date));

    let matchCounter = 0; 
    const MY_TEAM_NAME = "Родина";

    matches.forEach(match => {
      // Упрощенная проверка на участие
      const homeName = match.homeTeam?.name || "Хозяева";
      const awayName = match.awayTeam?.name || "Гости";
      
      if (!homeName.includes(MY_TEAM_NAME) && !awayName.includes(MY_TEAM_NAME)) return;

      matchCounter++;
      
      let scoreText = "— : —";
      let otBadge = "";
      
      if (match.score) {
        scoreText = `${match.score.home} : ${match.score.away}`;
        if (match.overtime) otBadge = `<span class="ot-badge">ОТ</span>`;
        if (match.shootout) otBadge = `<span class="ot-badge">Б</span>`;
      }

      const dateStr = match.date ? new Date(match.date).toLocaleDateString('ru-RU') : "Дата неизвестна";
      const arena = homeName.includes(MY_TEAM_NAME) ? "Родина-Лёд" : "Арена соперника";

      const card = document.createElement("div");
      card.className = "match-card";
      card.innerHTML = `
        <div class="match-info">
          <div class="logo-circle"><span>${homeName.substring(0,2)}</span></div>
          <span class="team-name">${homeName}</span>
          <div class="score-board">${scoreText} ${otBadge}</div>
          <span class="team-name">${awayName}</span>
          <div class="logo-circle"><span>${awayName.substring(0,2)}</span></div>
        </div>
        <div class="match-meta">
          <span class="match-number">Матч №${matchCounter}</span>
          <span class="match-date">${dateStr}</span>
          <div class="arena-label">${arena}</div>
        </div>
      `;
      container.appendChild(card);
    });

    if (matchCounter === 0) {
       container.innerHTML = `<p style="text-align: center; color: #777;">Матчей не найдено.</p>`;
    }
  }

  // Запускаем загрузку при открытии страницы
  document.addEventListener("DOMContentLoaded", fetchSchedule);

</script>

</body>
</html>
